[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "englex"
dynamic = ["version"]
description = "Private, offline-first Traditional-Chinese English engineering term lookup"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
englex = "englex.cli:main"

[tool.setuptools]
packages = ["englex"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "englex.__version__"}

[tool.setuptools.package-data]
englex = ["seed_data.json"]
