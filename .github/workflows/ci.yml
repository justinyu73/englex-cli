name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sdcv (optional local StarDict engine smoke)
        run: sudo apt-get update && sudo apt-get install -y sdcv

      - name: Data validation
        run: python3 -m englex validate-data

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Machine acceptance (P1-P5)
        run: python3 tests/p1_p5_machine_acceptance.py

      - name: Smoke suite
        run: |
          set -e
          for s in tests/*.sh; do
            case "$s" in
              # needs the VS Code `code` CLI, unavailable on headless runners; run locally
              tests/vscode-vsix-smoke.sh)
                echo "SKIP $s (requires the 'code' CLI / VS Code; run locally)"
                continue ;;
            esac
            echo "::group::$s"
            sh "$s"
            echo "::endgroup::"
          done
